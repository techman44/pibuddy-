name: "opencode GitHub Action (vendored, quota-safe)"
description: "Run opencode in GitHub Actions workflows; version probe authenticated"

inputs:
  model:
    description: "Model to use"
    required: true
  agent:
    description: "Agent to use"
    required: false
  share:
    description: "Share the opencode session"
    required: false
  prompt:
    description: "Custom prompt override"
    required: false
  use_github_token:
    description: "Use GITHUB_TOKEN directly instead of OpenCode App token exchange"
    required: false
    default: "false"
  mentions:
    description: "Trigger phrases"
    required: false
  variant:
    description: "Model variant"
    required: false
  oidc_base_url:
    description: "OIDC exchange base URL"
    required: false

runs:
  using: "composite"
  steps:
    - name: Get opencode version
      id: version
      shell: bash
      run: |
        AUTH=(-H "Accept: application/vnd.github+json")
        if [ -n "${GITHUB_TOKEN:-}" ]; then
          AUTH+=(-H "Authorization: Bearer $GITHUB_TOKEN")
        fi
        VERSION=$(curl -sf "${AUTH[@]}" https://api.github.com/repos/anomalyco/opencode/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4 || true)
        echo "version=${VERSION:-latest}" >> $GITHUB_OUTPUT

    - name: Cache opencode
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.opencode/bin
        key: opencode-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

    - name: Install opencode
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: curl -fsSL https://opencode.ai/install | bash

    - name: Add opencode to PATH
      shell: bash
      run: echo "$HOME/.opencode/bin" >> $GITHUB_PATH

    - name: Run opencode
      shell: bash
      id: run_opencode
      run: opencode github run
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        SHARE: ${{ inputs.share }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: ${{ inputs.use_github_token }}
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
        OIDC_BASE_URL: ${{ inputs.oidc_base_url }}
